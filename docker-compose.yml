name: cheer-tool
services:
  loadbalancer:
    image: nginx:alpine
    volumes:
      - ./loadbalancer/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      NGINX_UPSTREAM_SERVERS: |
        server cheer-tool-server-1:3000;
        server cheer-tool-server-2:3000;
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - 3000:80

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/var/lib/postgresql
      - ./postgres.conf:/etc/postgresql/postgresql.conf
    command: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      retries: 5
      start_period: 30s
      start_interval: 3s
      timeout: 10s

  server:
    build: server
    restart: unless-stopped
    env_file:
      - .env
      - .server.env
    environment:
      - DB_HOST=db
    deploy:
      replicas: 2
    volumes:
      - ./logs:/usr/src/app/logs
      - ./uploads:/usr/src/app/uploads
      - ./uploads/profilePictures:/usr/src/app/uploads/profilePictures
      - ./uploads/clubLogos:/usr/src/app/uploads/clubLogos
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test: wget -O - http://0.0.0.0:3000/health || exit 1
      interval: 10s
      retries: 5
      start_period: 30s
      start_interval: 3s
      timeout: 10s

  pgbackups:
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    volumes:
      - ./pgbackups:/backups
    env_file:
      - .env
      - .backup.env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_EXTRA_OPTS=-Z6 --schema=public --blobs
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    depends_on:
      db:
        condition: service_healthy