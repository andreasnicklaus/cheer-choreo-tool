name: Build Vue and Deploy to Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-26.04
    outputs:
      appChanged: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/pages.yml'

  install:
    needs: detect-changes
    if: needs.detect-changes.outputs.appChanged == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: app/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('app/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

  test-unit:
    needs: [detect-changes, install]
    if: needs.detect-changes.outputs.appChanged == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: app/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('app/package-lock.json') }}
      - name: Run Unit tests
        run: npm run test:unit
      - name: Upload Unit Test Coverage Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: jest-coverage-report
          path: "app/coverage/"
          retention-days: 30

  build:
    timeout-minutes: 15
    needs: [detect-changes, install]
    if: needs.detect-changes.outputs.appChanged == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: app/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('app/package-lock.json') }}
      - name: Build app
        run: npm run build
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

      - name: Copy index.html to 404.html
        run: cp dist/index.html dist/404.html

      - name: Create CNAME file
        run: echo www.choreo-planer.de > dist/CNAME

      # GitHub Pages drops dot-directories (e.g. .well-known) unless a
      # .nojekyll marker sits at the artifact root. Re-assert it here so the
      # agent-discovery files under dist/.well-known/ are actually published.
      - name: Ensure .nojekyll marker
        run: touch dist/.nojekyll

      # Fail loudly if the agent-discovery surfaces are missing from the build
      # output, so a broken publish never ships silently.
      - name: Verify agent-discovery files are present
        run: |
          set -e
          required=(
            ".well-known/ard.json"
            ".well-known/agent-card.json"
            ".well-known/mcp/server-card.json"
            ".well-known/agent-skills/index.json"
            ".well-known/api-catalog"
            "llms.txt"
            "robots.txt"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::Missing expected published file: dist/$f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Agent-discovery files missing from build output." >&2
            exit 1
          fi

      - name: Upload Built files
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: app/dist
          include-hidden-files: true
      - name: Upload Built files
        uses: actions/upload-artifact@v7
        with:
          name: ui-pages
          path: app/dist
          include-hidden-files: true

  test-integration:
    needs: [detect-changes, build, install]
    if: needs.detect-changes.outputs.appChanged == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./app

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: app/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('app/package-lock.json') }}
      - uses: actions/download-artifact@v8
        with:
          name: ui-pages
          path: app/dist
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-playwright-${{ hashFiles('app/package-lock.json') }}
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright system dependencies
        run: npx playwright install-deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Run Playwright tests
        run: npm run test:e2e -- --shard=${{ matrix.shardIndex }}/7
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: "app/playwright-report/"
          retention-days: 30

  deploy:
    needs:
      - build
      - test-integration
      - test-unit
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
