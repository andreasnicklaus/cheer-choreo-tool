<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />

    <!-- HTML Meta Tags -->
    <title>Choreo Planer | Das kostenlose Online-Tool für Choreo-Sport</title>

    <!-- Facebook Meta Tags -->
    <meta data-vmid="og:type" property="og:type" content="website" />
    <meta
      data-vmid="og:title"
      property="og:title"
      content="Choreo Planer | Das kostenlose Online-Tool für Choreo-Sport"
    />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      data-vmid="twitter:title"
      name="twitter:title"
      content="Choreo Planer | Das kostenlose Online-Tool für Choreo-Sport"
    />

    <script>
      (function () {
        var t = localStorage.getItem("theme-preference");
        if (!t)
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.setAttribute("data-bs-theme", t);
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" href="/favicon-dark.ico" media="(prefers-color-scheme: dark)" />
    <link rel="prefetch" href="/Icon.png" />
    <link rel="prefetch" href="/Icon-PrimaryLight.svg" />
    <link rel="prefetch" href="/Icon-PrimaryDark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Fraunces:ital,opsz,wght@0,9,400;0,9,700;1,9,400&family=Roboto:wght@400&display=swap"
    />
    <script
      src="https://uptime.betterstack.com/widgets/announcement.js"
      data-id="216278"
      async="async"
      type="text/javascript"
    ></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <strong
        >We're sorry but Choreo Planer doesn't work properly without JavaScript

      >

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
